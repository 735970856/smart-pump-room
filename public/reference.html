<script>
/* 静态大屏示例。泵房为原图场景，面板、图表、交互为原生 HTML/CSS/JS。
   若接入真实设备，请将本地状态更新替换为经过授权的后端接口。
   修改下面的 dashboardData 即可替换初始运行参数。 */
const dashboardData={inlet:0.32,outlet:0.65,target:0.60,flow:125.6,total:128560,pumps:[{id:1,current:12.5,frequency:50.0,pressure:0.62,temperature:36.2,running:true},{id:2,current:11.8,frequency:45.0,pressure:0.60,temperature:35.6,running:true},{id:3,current:0.0,frequency:0.0,pressure:0.00,temperature:28.5,running:false}],pressureIn:[.53,.51,.65,.52,.57,.74,.76,.62,.75,.79],pressureOut:[.61,.63,.66,.64,.65,.68,.67,.64,.66,.65],flowTrend:[138,132,174,179,141,161,205,188,239,245],alarms:[{time:'09-09 13:24',device:'3#水泵',message:'过载保护',level:'严重',type:'serious',detail:'3#水泵触发过载保护，当前设备处于停止状态。请检查电机负载及保护器状态。'},{time:'09-09 11:16',device:'末端压力',message:'压力低于设定值',level:'一般',type:'warning',detail:'末端压力曾低于系统设定压力，请检查供水工况及压力传感器。'},{time:'09-09 09:03',device:'1#水泵',message:'温度过高',level:'一般',type:'warning',detail:'1#水泵温度曾超过告警阈值，建议检查电机散热和环境通风。'},{time:'09-09 08:21',device:'系统',message:'通讯异常',level:'提示',type:'info',detail:'检测到设备通讯中断记录，请检查通讯链路与设备在线状态。'}]};
const state={device:'pump',selectedPump:0,pumpTouched:false,mode:'manual',pressure:'inlet',clockLive:false};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fitScreen(){const s=Math.min(innerWidth/1672,innerHeight/941),el=$('#screen');el.style.transform=`scale(${s})`;el.style.left=`${(innerWidth-1672*s)/2}px`;el.style.top=`${(innerHeight-941*s)/2}px`;}
addEventListener('resize',fitScreen);fitScreen();
function renderPumps(){const list=$('#device-list');list.classList.remove('alternative');list.innerHTML=dashboardData.pumps.map((p,i)=>`<button class="device-row ${state.pumpTouched&&i===state.selectedPump?'selected':''}" data-select-pump="${i}" aria-label="${p.id}号水泵，${p.running?'运行中':'已停止'}，点击选择" aria-pressed="${state.pumpTouched&&i===state.selectedPump}"><span class="thumb" aria-hidden="true"></span><span class="device-info"><span class="device-title"><span>${p.id}# 水泵</span><span class="device-state ${p.running?'':'stopped'}"><i class="status-dot ${p.running?'':'off'}"></i>${p.running?'运行中':'已停止'}</span></span><span class="device-grid"><div><span class="label">电流</span><strong>${p.current.toFixed(1)}<span class="unit">A</span></strong></div><div><span class="label">频率</span><strong>${p.frequency.toFixed(1)}<span class="unit">Hz</span></strong></div><div><span class="label">出口压力</span><strong>${p.pressure.toFixed(2)}<span class="unit">MPa</span></strong></div><div><span class="label">温度</span><strong>${p.temperature.toFixed(1)}<span class="unit">°C</span></strong></div></span></span></button>`).join('');}
const assets={cabinet:{title:'配电柜',icon:'cabinet',values:[['电压','380','V'],['总电流','24.3','A'],['运行频率','50.0','Hz'],['状态','正常','']]},pressure:{title:'稳压罐',icon:'tank',values:[['罐内压力','0.65','MPa'],['容积','0.50','m³'],['设计压力','1.00','MPa'],['状态','正常','']]},stable:{title:'稳流罐',icon:'tank',values:[['进水压力','0.32','MPa'],['容积','2.00','m³'],['液位','正常',''],['状态','正常','']]}};
function setDevice(type){state.device=type;$$('.device-tab').forEach(b=>{b.classList.toggle('active',b.dataset.device===type);b.setAttribute('aria-selected',String(b.dataset.device===type));});if(type==='pump'){renderPumps();return;}const a=assets[type];$('#device-list').classList.add('alternative');$('#device-list').innerHTML=`<button class="device-row" data-asset-detail="${type}" aria-label="查看${a.title}详情"><span class="asset-icon">${icon(a.icon)}</span><span class="device-info"><span class="device-title"><span>${a.title}</span><span class="device-state"><i class="status-dot"></i>正常</span></span><span class="device-grid">${a.values.map(v=>`<div><span class="label">${v[0]}</span><strong>${v[1]}<span class="unit">${v[2]}</span></strong></div>`).join('')}</span></span></button>`;}
function selectPump(i,open=false){state.selectedPump=i;state.pumpTouched=true;setDevice('pump');const pos=[650,773,886];$('#scene-selected').style.display='block';$('#scene-selected').style.left=pos[i]+'px';if(open)showPump(i);else toast(`已选择 ${i+1}# 水泵`);}
function curve(points){let d=`M${points[0][0]},${points[0][1]}`;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=(b[0]-a[0])*.43;d+=` C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;}return d;}
function renderChart(id,data,max,color,labels){const el=$('#'+id),x0=34,x1=297,y0=5,y1=88;const pts=data.map((v,i)=>[x0+(x1-x0)*i/(data.length-1),y1-v/max*(y1-y0)]);const d=curve(pts),grad=id+'-gradient';let s=`<defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".56"/><stop offset="100%" stop-color="${color}" stop-opacity=".02"/></linearGradient></defs>`;for(let i=0;i<labels.length;i++){const y=y0+i*(y1-y0)/(labels.length-1);s+=`<line class="chart-grid" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/><text x="24" y="${y+4}" text-anchor="end">${labels[i]}</text>`;}for(let i=0;i<9;i++){const x=x0+(x1-x0)*i/8;s+=`<line class="chart-grid" x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/>`;}s+=`<path d="${d} L${x1},${y1} L${x0},${y1}Z" fill="url(#${grad})"/><path class="chart-trace" d="${d}" stroke="${color}"/>`;pts.forEach((p,i)=>{if(i%2===0||i===data.length-1)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.3" fill="${color}" stroke="${color}" stroke-width=".5"/>`;});s+=`<line class="chart-axis" x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}"/>`;['08:00','10:00','12:00','14:00','16:00'].forEach((t,i)=>s+=`<text x="${x0+(x1-x0)*i/4}" y="104" text-anchor="middle">${t}</text>`);s+=`<line class="chart-cursor" x1="0" x2="0" y1="${y0}" y2="${y1}"/>`;el.innerHTML=s;el.onpointermove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*305,i=Math.max(0,Math.min(data.length-1,Math.round((x-x0)/(x1-x0)*(data.length-1)))),tooltip=$('#'+(id==='pressure-chart'?'pressure':'flow')+'-tooltip'),cursor=el.querySelector('.chart-cursor');tooltip.style.display='block';const minutes=8*60+Math.round(i*8*60/(data.length-1));tooltip.textContent=`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}　${data[i].toFixed(id==='pressure-chart'?2:0)} ${id==='pressure-chart'?'MPa':'m³/h'}`;cursor.setAttribute('x1',pts[i][0]);cursor.setAttribute('x2',pts[i][0]);cursor.style.display='block';};el.onpointerleave=()=>{$('#'+(id==='pressure-chart'?'pressure':'flow')+'-tooltip').style.display='none';el.querySelector('.chart-cursor').style.display='none';};}
function pressureChart(type){state.pressure=type;$$('[data-pressure]').forEach(b=>b.classList.toggle('active',b.dataset.pressure===type));renderChart('pressure-chart',type==='inlet'?dashboardData.pressureIn:dashboardData.pressureOut,1.2,'#27b9ff',['1.2','0.9','0.6','0.3','0']);}
function alarmRows(){return dashboardData.alarms.map((a,i)=>`<tr data-alarm="${i}" tabindex="0" role="button" aria-label="${a.time} ${a.device} ${a.message} ${a.level}"><td>${a.time}</td><td>${a.device}</td><td>${a.message}</td><td class="${a.type}">${a.level}</td></tr>`).join('');}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500);}
let returnFocus;function modal(title,body){returnFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-mask').classList.add('open');$('#modal-close').focus();}
function closeModal(){$('#modal-mask').classList.remove('open');$$('.nav-item').forEach(b=>{b.classList.toggle('active',b.dataset.nav==='home');if(b.dataset.nav==='home')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});returnFocus?.focus();}
function tile(label,value,unit=''){return `<div class="detail-tile"><span>${esc(label)}</span><strong>${esc(value)}<small>${esc(unit)}</small></strong></div>`;}
function showPump(i){const p=dashboardData.pumps[i];modal(`${p.id}# 水泵 · 运行参数`,`<div class="detail-grid">${tile('运行状态',p.running?'运行中':'已停止')}${tile('电流',p.current.toFixed(1),'A')}${tile('频率',p.frequency.toFixed(1),'Hz')}${tile('出口压力',p.pressure.toFixed(2),'MPa')}${tile('电机温度',p.temperature.toFixed(1),'°C')}${tile('控制方式',state.mode==='manual'?'手动':'自动')}</div><p class="modal-note">当前显示参考图中的示例数据。启动、停止仅切换本页面的演示状态。</p>`);}
function showAsset(type){const a=assets[type];modal(`${a.title} · 设备信息`,`<div class="detail-grid">${a.values.map(v=>tile(...v)).join('')}${tile('在线状态','在线')}${tile('所属系统','供水系统')}</div><p class="modal-note">当前为界面演示，显示参考场景的示例参数。</p>`);}
function updatePumpState(running){if(state.mode==='auto'){toast('当前为自动模式，请先切换至手动模式');return;}const p=dashboardData.pumps[state.selectedPump];if(p.running===running){toast(`${p.id}# 水泵${running?'已在运行':'已停止'}`);return;}p.running=running;p.current=running?12.5:0;p.frequency=running?50:0;p.pressure=running?.62:0;p.temperature=running?36.2:28.5;state.pumpTouched=true;setDevice('pump');const n=dashboardData.pumps.filter(p=>p.running).length;$('#running-count').textContent=`${n} / 3`;$('#system-state').textContent=n?'正常运行':'系统待机';$('#system-dot').classList.toggle('off',!n);$$('.scene-status-patch').forEach((el,i)=>{const p=dashboardData.pumps[i];el.style.display='flex';el.innerHTML=`<i class="status-dot ${p.running?'':'off'}"></i>${p.running?'运行':'停止'}`;});toast(`演示：${p.id}# 水泵已${running?'启动':'停止'}`);}
function setMode(mode){state.mode=mode;$('#manual-btn').classList.toggle('active',mode==='manual');$('#auto-btn').classList.toggle('active',mode==='auto');$('#manual-btn').setAttribute('aria-pressed',String(mode==='manual'));$('#auto-btn').setAttribute('aria-pressed',String(mode==='auto'));toast(`已切换为${mode==='manual'?'手动':'自动'}模式`);}
function showAlarms(){modal('报警中心',`<table class="alarm-table"><thead><tr><th>时间</th><th>设备</th><th>告警内容</th><th>等级</th></tr></thead><tbody>${alarmRows()}</tbody></table><p class="modal-note">共 ${dashboardData.alarms.length} 条告警记录，点击可查看详情。</p>`);}
function alarmDetail(i){const a=dashboardData.alarms[i];modal('告警详情',`<div class="detail-grid">${tile('设备',a.device)}${tile('告警等级',a.level)}${tile('发生时间',a.time)}</div><h3 class="subheading">${esc(a.message)}</h3><p>${esc(a.detail)}</p><p class="modal-note">本条记录为参考图中的演示告警。</p>`);}
function energyChart(){const data=[125,144,138,165,156,179,186,170,195,211,203,189],bars=data.map((v,i)=>`<rect x="${44+i*58}" y="${190-v*.65}" width="24" height="${v*.65}" rx="3" fill="url(#bar-grad)"/><text x="${56+i*58}" y="212" text-anchor="middle">${i*2}:00</text>`).join('');return `<svg class="energy-chart" viewBox="0 0 760 230" role="img" aria-label="示例24小时能耗趋势"><defs><linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40e5ff"/><stop offset="1" stop-color="#137fe080"/></linearGradient></defs><path d="M25 20v170h710" fill="none" stroke="#6fcdfb44"/>${bars}</svg>`;}
function showSettings(){modal('系统设置',`<div class="setting-row"><div>时间显示<small>默认固定为原图时间，开启后显示北京时间</small></div><button id="clock-toggle">${state.clockLive?'使用原图时间':'显示当前时间'}</button></div><div class="setting-row"><div>设定压力<small>仅更新页面的示例设定值，单位 MPa</small></div><input id="pressure-input" type="number" min="0.1" max="1.5" step="0.01" value="${dashboardData.target.toFixed(2)}" aria-label="设定压力"></div><div class="setting-row"><div>全屏显示<small>按 Esc 可退出全屏</small></div><button id="fullscreen-btn">切换全屏</button></div><div class="settings-foot"><button class="modal-action" id="save-settings">保存设置</button></div>`);}
function showNav(nav){$$('.nav-item').forEach(b=>{b.classList.toggle('active',b.dataset.nav===nav);if(b.dataset.nav===nav)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(nav==='home'){closeModal();return;}if(nav==='monitor'){modal('运行监控',`<div class="detail-grid">${tile('进水压力',dashboardData.inlet.toFixed(2),'MPa')}${tile('末端压力',dashboardData.outlet.toFixed(2),'MPa')}${tile('供水流量',dashboardData.flow.toFixed(1),'m³/h')}${tile('运行水泵',dashboardData.pumps.filter(p=>p.running).length+' / 3','台')}${tile('累计流量','128,560','m³')}${tile('控制模式',state.mode==='manual'?'手动':'自动')}</div><h3 class="subheading">水泵实时参数</h3><div class="select-pump">${dashboardData.pumps.map((p,i)=>`<button data-detail-pump="${i}">${p.id}# 水泵 · ${p.running?'运行':'停止'}</button>`).join('')}</div><p class="modal-note">当前为静态演示，数据与参考图一致。</p>`);}else if(nav==='devices'){modal('设备管理',`<div class="detail-grid">${tile('水泵','3','台')}${tile('配电柜','1','组')}${tile('储罐','2','台')}</div><h3 class="subheading">设备列表</h3><div class="select-pump">${dashboardData.pumps.map((p,i)=>`<button data-detail-pump="${i}">${p.id}# 水泵</button>`).join('')}<button data-detail-asset="cabinet">配电柜</button><button data-detail-asset="pressure">稳压罐</button><button data-detail-asset="stable">稳流罐</button></div>`);}else if(nav==='energy'){modal('能耗统计',`<div class="detail-grid">${tile('今日用电（示例）','1,286.5','kWh')}${tile('今日供水（示例）','2,653.0','m³')}${tile('单方水耗电（示例）','0.485','kWh/m³')}</div><h3 class="subheading">24 小时用电趋势 · 示例</h3>${energyChart()}<p class="modal-note">能耗数据为交互演示数据，可在源码中替换。</p>`);}else if(nav==='alarms'){showAlarms();}else if(nav==='settings'){showSettings();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.device)setDevice(b.dataset.device);if(b.dataset.pressure)pressureChart(b.dataset.pressure);if(b.dataset.selectPump!==undefined)selectPump(+b.dataset.selectPump,true);if(b.dataset.pump!==undefined)selectPump(+b.dataset.pump,true);if(b.dataset.detailPump!==undefined)showPump(+b.dataset.detailPump);if(b.dataset.assetDetail)showAsset(b.dataset.assetDetail);if(b.dataset.detailAsset)showAsset(b.dataset.detailAsset);if(b.dataset.scene){const t=b.dataset.scene;if(t==='inlet'||t==='outlet'){pressureChart(t);toast(t==='inlet'?'已显示进水压力趋势':'已显示末端压力趋势');}else{setDevice(t);showAsset(t);}}if(b.dataset.nav)showNav(b.dataset.nav);if(b.id==='clock-toggle'){state.clockLive=!state.clockLive;updateClock();b.textContent=state.clockLive?'使用原图时间':'显示当前时间';}if(b.id==='fullscreen-btn'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('当前环境无法进入全屏'));}if(b.id==='save-settings'){const v=+$('#pressure-input').value;if(!Number.isFinite(v)||v<.1||v>1.5){toast('请输入 0.10～1.50 MPa 的设定压力');return;}dashboardData.target=v;$('#target-value').textContent=v.toFixed(2);closeModal();toast('页面设置已保存');}}const row=e.target.closest('[data-alarm]');if(row)alarmDetail(+row.dataset.alarm);});
$('#start-btn').onclick=()=>updatePumpState(true);$('#stop-btn').onclick=()=>updatePumpState(false);$('#manual-btn').onclick=()=>setMode('manual');$('#auto-btn').onclick=()=>setMode('auto');$('#more-alarms').onclick=showAlarms;$('#modal-close').onclick=closeModal;$('#modal-mask').onclick=e=>{if(e.target.id==='modal-mask')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const row=e.target.closest('[data-alarm]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();alarmDetail(+row.dataset.alarm);}if(e.key==='Tab'&&$('#modal-mask').classList.contains('open')){const focusable=$$('.modal button,.modal input,.modal [tabindex="0"]'),first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function updateClock(){if(!state.clockLive){$('#clock').textContent='2026-09-09 14:36:18';$('#weekday').textContent='星期三';return;}const now=new Date(),parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(now),v=t=>parts.find(p=>p.type===t).value;$('#clock').textContent=`${v('year')}-${v('month')}-${v('day')} ${v('hour')}:${v('minute')}:${v('second')}`;$('#weekday').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',weekday:'long'}).format(now);}
setInterval(()=>{if(state.clockLive)updateClock();},1000);
renderPumps();pressureChart('inlet');renderChart('flow-chart',dashboardData.flowTrend,300,'#29dfbc',['300','200','100','0']);$('#alarm-body').innerHTML=alarmRows();
</script>
</body>
</html>
